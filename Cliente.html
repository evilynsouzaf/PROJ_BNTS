<!DOCTYPE html>
<html>
<head>
  <base target="_self">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#004686', secondary: '#8BC0E8', light: '#E2EEF9' } } }
    }
  </script>
</head>
<body class="bg-light p-4 md:p-10 font-sans">

<div class="max-w-6xl mx-auto bg-white p-8 rounded-2xl shadow-2xl">
  <h1 class="text-3xl font-extrabold text-center text-primary mb-8 border-b pb-4">
    Painel de Controle de Processos
  </h1>
  <div class="bg-gray-50 p-6 rounded-xl border border-gray-200 mb-10">
    <h2 class="text-xl font-bold text-primary mb-6"> + Novo Processo</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-gray-700 font-bold mb-2">Documento de identificação (CPF/CNPJ) </label>
        <input list="listaClientes" id="clienteInput" class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary outline-none" placeholder="Nome do Cliente">
        <datalist id="listaClientes"></datalist>
      </div>

      <div>
        <label class="block text-gray-700 font-bold mb-2">Unidade / Agência</label>
        <input list="listaUnidades" id="unidadeInput" class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary outline-none" placeholder="Nome da Unidade">
        <datalist id="listaUnidades"></datalist>
      </div>

      <div>
        <label class="block text-gray-700 font-bold mb-2">Valor (R$)</label>
        <input id="valor" type="number" class="w-full border rounded-lg px-4 py-2" placeholder="Ex: 12000">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-gray-700 font-bold mb-2">Garantia Real?</label>
          <select id="garantia" class="w-full border rounded-lg px-4 py-2">
            <option>Sim</option>
            <option>Não</option>
          </select>
        </div>
        <div>
          <label class="block text-gray-700 font-bold mb-2">Status Inicial</label>
          <select id="status" class="w-full border rounded-lg px-4 py-2">
            <option>Iniciado</option>
            <option>Analisando</option>
            <option>Pendente</option>
            <option>Paralisado</option>
            <option>Finalizado</option>
          </select>
        </div>
      </div>
    </div>
    
    <button onclick="salvar()" class="mt-6 bg-primary hover:bg-blue-800 text-white font-bold py-3 rounded-lg w-full shadow transition">
      SALVAR PROCESSO
    </button>
  </div>

  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold text-primary">📊 Processos Ativos</h2>
    <button onclick="carregar()" class="bg-secondary hover:bg-blue-400 text-white font-bold py-2 px-6 rounded-lg shadow transition">
      🔄 Atualizar Tabela
    </button>
  </div>

  <div class="overflow-x-auto">
    <table id="tabela" class="w-full text-sm text-left border-collapse border border-gray-200">
      </table>
  </div>
</div>

<script>
  window.onload = () => {
    google.script.run.withSuccessHandler(dados => {
      dados.clientes.forEach(nome => document.getElementById('listaClientes').insertAdjacentHTML('beforeend', `<option value="${nome}">`));
      dados.unidades.forEach(nome => document.getElementById('listaUnidades').insertAdjacentHTML('beforeend', `<option value="${nome}">`));
    }).obterDadosParaFormulario();
    
    carregar(); 
  };

  function carregar() {
    document.getElementById("tabela").innerHTML = "<tr><td class='p-6 text-center text-gray-500'>Sincronizando com o banco de dados...</td></tr>";
    google.script.run.withSuccessHandler(mostrar).buscarProcessosComJoin();
  }

  function mostrar(dados) {
    let html = `<thead>
      <tr class="bg-gray-100 text-primary uppercase text-xs">
        <th class="p-3 border">Cliente</th>
        <th class="p-3 border">Unidade</th>
        <th class="p-3 border">Valor (R$)</th>
        <th class="p-3 border text-center">Garantia</th>
        <th class="p-3 border text-center">Status</th>
        <th class="p-3 border text-center">Prioridade</th>
        <th class="p-3 border text-center">Ações</th>
      </tr>
    </thead><tbody>`;

    dados.forEach(p => {

      let corStatus = "bg-gray-200 text-gray-800";
      if (p.status === "Finalizado") corStatus = "bg-green-100 text-green-800 border-green-300";
      if (p.status === "Paralisado") corStatus = "bg-red-100 text-red-800 border-red-300";
      if (p.status === "Pendente") corStatus = "bg-yellow-100 text-yellow-800 border-yellow-300";
      if (p.status === "Analisando") corStatus = "bg-blue-100 text-blue-800 border-blue-300";
      if (p.status === "Iniciado") corStatus = "bg-purple-100 text-purple-800 border-purple-300";

      let corPrio = "bg-gray-200 text-gray-700";
      if (p.prioridade === "Alta") corPrio = "bg-red-500 text-white font-bold animate-pulse";
      if (p.prioridade === "Média") corPrio = "bg-yellow-400 text-gray-900 font-semibold";
      if (p.prioridade === "Baixa") corPrio = "bg-emerald-400 text-white font-semibold";

      html += `
      <tr class="border-b hover:bg-gray-50 transition">
        <td class="p-3 border font-medium">${p.cliente}</td>
        <td class="p-3 border text-gray-600">${p.unidade}</td>
        <td class="p-3 border text-gray-800 font-semibold">R$ ${p.valor.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
        <td class="p-3 border text-center">${p.garantia}</td>
        <td class="p-3 border text-center"><span class="px-2 py-1 border rounded text-xs font-bold ${corStatus}">${p.status}</span></td>
        <td class="p-3 border text-center"><span class="px-2 py-1 rounded text-xs shadow-sm ${corPrio}">${p.prioridade}</span></td>
        <td class="p-3 border text-center">
          <button onclick="editarStatus(${p.linhaPlanilha}, '${p.status}')" class="text-blue-600 hover:text-blue-800 mx-1" title="Alterar Status">✏️</button>
          <button onclick="deletar(${p.linhaPlanilha})" class="text-red-600 hover:text-red-800 mx-1" title="Excluir">🗑️</button>
        </td>
      </tr>`;
    });
    
    document.getElementById("tabela").innerHTML = html + "</tbody>";
  }

  function salvar() {
    const cli = document.getElementById("clienteInput").value;
    const uni = document.getElementById("unidadeInput").value;
    const val = document.getElementById("valor").value;
    const gar = document.getElementById("garantia").value;
    const sta = document.getElementById("status").value;

    if (!cli || !val || !uni) { alert("⚠️ Preencha Cliente, Unidade e Valor!"); return; }

    google.script.run
      .withSuccessHandler(() => {
        alert("✅ Processo salvo!");
        document.getElementById("clienteInput").value = "";
        document.getElementById("unidadeInput").value = "";
        document.getElementById("valor").value = "";
        carregar();
      }).criarProcesso(cli, val, gar, sta, uni);
  }

  // UPDATE
  function editarStatus(linha, statusAtual) {
    let novoStatus = prompt(`Alterar status.\nOpções: Iniciado, Analisando, Pendente, Paralisado, Finalizado.\n\nStatus atual:`, statusAtual);
    if (novoStatus && novoStatus !== statusAtual) {
      document.getElementById("tabela").innerHTML = "<tr><td class='p-6 text-center text-blue-500'>Atualizando status...</td></tr>";
      google.script.run.withSuccessHandler(() => carregar()).atualizarStatus(linha, novoStatus);
    }
  }

  // DELETE
  function deletar(linha) {
    if (confirm("🚨 Tem certeza que deseja excluir este processo de forma permanente?")) {
      document.getElementById("tabela").innerHTML = "<tr><td class='p-6 text-center text-red-500'>Excluindo registro...</td></tr>";
      google.script.run.withSuccessHandler(() => carregar()).excluirProcesso(linha);
    }
  }
</script>
</body>
</html>
